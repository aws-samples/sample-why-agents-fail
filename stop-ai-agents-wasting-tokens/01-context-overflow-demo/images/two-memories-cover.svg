<svg width="1000" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(49,27,146,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="winshadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a237e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect width="1000" height="420" fill="url(#grid)"/>

  <!-- Title (centered) -->
  <text x="500" y="62" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#1a237e" text-anchor="middle">AI Agent Memory: Conversation vs Context</text>
  <text x="500" y="98" font-family="Arial, sans-serif" font-size="20" fill="#5a6478" text-anchor="middle">Semantic recall  ·  Exact reference  ·  Keep them separate</text>

  <!-- macOS window (centered) -->
  <g filter="url(#winshadow)">
    <rect x="110" y="130" width="780" height="250" rx="12" fill="#282c34"/>
    <path d="M110 142 a12 12 0 0 1 12 -12 h756 a12 12 0 0 1 12 12 v22 h-780 z" fill="#3a3f4b"/>
    <circle cx="134" cy="153" r="7" fill="#ff5f56"/>
    <circle cx="158" cy="153" r="7" fill="#ffbd2e"/>
    <circle cx="182" cy="153" r="7" fill="#27c93f"/>
    <text x="500" y="158" font-family="Menlo, Monaco, monospace" font-size="14" fill="#9aa2b1" text-anchor="middle">agent.py</text>

    <!-- code -->
    <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="17">
      <text x="134" y="200" fill="#7f848e"># one agent, two memories — keep them separate</text>

      <text x="134" y="232"><tspan fill="#c678dd">agent</tspan><tspan fill="#abb2bf"> = </tspan><tspan fill="#61afef">Agent</tspan><tspan fill="#abb2bf">(</tspan></text>

      <text x="166" y="264"><tspan fill="#abb2bf">session_manager=</tspan><tspan fill="#61afef">AgentCoreMemory</tspan><tspan fill="#abb2bf">(cfg),</tspan></text>
      <text x="640" y="264" fill="#7f848e"># conversation</text>

      <text x="166" y="296"><tspan fill="#abb2bf">plugins=[</tspan><tspan fill="#61afef">ContextOffloader</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#61afef">S3Storage</tspan><tspan fill="#abb2bf">())],</tspan></text>
      <text x="640" y="296" fill="#7f848e"># context</text>

      <text x="134" y="328" fill="#abb2bf">)</text>
    </g>
  </g>
</svg>
